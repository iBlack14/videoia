<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDEOIA · Seguridad web</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1520;color:#f3f5ef;font-family:system-ui,sans-serif}main{max-width:1050px;margin:36px auto;padding:24px;display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:44px;align-items:center}video{width:100%;aspect-ratio:9/16;object-fit:contain;max-height:82vh;border-radius:24px;background:#101921;box-shadow:0 20px 70px #0008}h1{font-size:clamp(32px,5vw,58px);line-height:1.04;letter-spacing:-2px}small{color:#b9f96b;letter-spacing:3px}p{color:#bacad8;line-height:1.6}button{cursor:pointer;border:1px solid #456174;background:#1a3043;color:white;border-radius:12px;padding:14px 18px;font:inherit;margin:4px 4px 4px 0}button:hover,button:focus-visible{border-color:#b9f96b;background:#29404c}button.active{background:#b9f96b;color:#101921}.answers button.active[data-answer="wrong"]{background:#ff9c8e;color:#301b1a}.quiz{margin-top:28px;border-top:1px solid #456174;padding-top:20px}.answers{display:flex;flex-direction:column}#feedback{min-height:70px}a{color:#b9f96b}@media(max-width:700px){main{grid-template-columns:1fr;margin:0;gap:20px}video{max-height:65vh}h1{margin-top:10px}}
</style></head><body><main><video id="film" poster="animated-frames/frame-00-at-3s.png" src="seguridad-web-animado.mp4" controls playsinline preload="metadata" aria-label="Video sobre seguridad web"></video><section><small>VIDEOIA / APRENDE HACIENDO</small><h1>¿Confiarías en esta web?</h1><p>Explora el video y prueba lo que aprendiste. Estas opciones sí son interactivas en esta página.</p><nav aria-label="Controles"><button id="restart">↺ Repetir</button><button id="sound">Silenciar</button><button id="speed">Velocidad ×1</button></nav><div class="quiz"><h2>Una página tiene HTTPS. ¿Qué sabes con eso?</h2><div class="answers"><button data-answer="wrong">Que la empresa es confiable</button><button data-answer="right">Que la conexión está cifrada</button><button data-answer="wrong">Que es imposible que sea una estafa</button></div><p id="feedback" role="status" aria-live="polite">Elige una respuesta.</p><button id="reset">Intentar de nuevo</button></div><p><a href="seguridad-web-animado.mp4" download>Descargar MP4</a></p></section></main><script>
const film=document.querySelector('#film');document.querySelector('#restart').onclick=()=>{film.currentTime=0;film.play().catch(()=>{});};document.querySelector('#sound').onclick=e=>{film.muted=!film.muted;e.target.textContent=film.muted?'Activar sonido':'Silenciar';};document.querySelector('#speed').onclick=e=>{film.playbackRate=film.playbackRate===1?1.25:film.playbackRate===1.25?1.5:1;e.target.textContent='Velocidad ×'+film.playbackRate;};const feedback=document.querySelector('#feedback');const choices=[...document.querySelectorAll('[data-answer]')];choices.forEach(button=>button.onclick=()=>{choices.forEach(b=>b.classList.remove('active'));button.classList.add('active');feedback.textContent=button.dataset.answer==='right'?'¡Correcto! HTTPS cifra la conexión. También debes revisar quién está detrás del sitio.':'Cuidado: una web fraudulenta también puede tener HTTPS. El cifrado no demuestra que el sitio sea honesto.';});document.querySelector('#reset').onclick=()=>{choices.forEach(b=>b.classList.remove('active'));feedback.textContent='Elige una respuesta.';};
</script></body></html>
